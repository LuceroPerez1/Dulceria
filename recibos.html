<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulceria JAJA</title>
    <style>
    body {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }

    .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 80px;
    }

    .navegador ul {
        display: flex;
        list-style: none;
        gap: 40px;
        padding: 0;
        margin: 0;
        font-size: large;
    }

    .navegador a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo img {
        height: 45px;
        width: 45px;
    }

    .contenidoBuscador {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 80px;
    }

    .inputConIcono {
        position: relative;
        display: flex;
    }

    .inputConIcono svg {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        color: #aaa;
    }

    .inputConIcono input {
        width: 300px;
        padding: 6px 10px 6px 35px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
          <div class="logo">
            <img src="https://cdn.pixabay.com/photo/2022/12/29/17/14/candy-7685391_1280.png">
            <h3>Dulcería JAJA</h3>
          </div>
          <div class="navegador">
            <ul>
                <li><a href="./registros.html">Registros</a></li>
                <li><a href="./empleados.html">Empleados</a></li>
                <li><a href="./recibos.html">Recibos</a></li>
                <li><a href="./asistencias.html">Asistencias</a></li>
            </ul>
          </div>
        </div>
    </header>
</body>
</html>
